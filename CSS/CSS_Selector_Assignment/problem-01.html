<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Now Showing</title>
  <style>
    /* Universal selector */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Element selector */
    body {
      background-color: #f7f7f7;
      padding: 40px 20px;
    }

    /* ID selector */
    #now-showing {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      overflow: hidden;
    }

    /* Class selectors */
    .movie-card {
      float: left;
      width: 48%;
      height: 95px;
      margin: 0 1% 17px 1%;
      border: 1px solid #ffb3c6;
      background-color: #ffffff;
    }

    .poster {
      float: left;
      width: 94px;
      height: 93px;
      display: block;
    }

    .info {
      margin-left: 106px;
      padding-top: 12px;
    }

    .book-btn {
      background-color: #f84464;
      color: #ffffff;
      border: none;
      border-radius: 5px;
      padding: 6px 10px;
      font-size: 9px;
      cursor: pointer;
    }

    /* Grouping selector */
    h3, p {
      font-family: "Times New Roman", serif;
      color: #000000;
    }

    h3 {
      font-size: 12px;
      margin-bottom: 12px;
    }

    p {
      font-size: 10px;
      margin-bottom: 8px;
    }
  </style>
